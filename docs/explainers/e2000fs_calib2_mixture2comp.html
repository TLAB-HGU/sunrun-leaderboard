<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mixture2comp · inference</title>
<style>/* ===========================================================================
   bbycroft.net/llm style app shell — light grey, sidebar 3 : canvas 5,
   phase chips #d1d5e7 / active #8587f7, timeline #ccccdf + caret #0c6fdf,
   30px bordered buttons, Roboto + serif headings, monospace numbers.
   =========================================================================== */
:root{
  --bg:#f3f3f3; --ink:#000; --ink-2:#3d3d3d; --ink-3:#777; --ink-4:#9a9a9a;
  --rule:#999; --rule-2:#ccc;
  --chip:#d1d5e7; --chip-ink:#555; --active:#8587f7;
  --caret:#0c6fdf; --line:#ccccdf; --evt:#a1a1a1;
  --accent:#0c6fdf; --warn:#b45309; --ok:#3a7d44;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --sans:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",
         "Noto Sans KR",sans-serif;
  --serif:Merriweather,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
  display:flex;flex-direction:column;overflow:hidden}

/* ---------- top bar ---------- */
.top{flex:none;display:flex;align-items:center;gap:14px;height:44px;padding:0 14px;
  background:#fff;border-bottom:1px solid #e2e2e2}
.top .brand{font-family:var(--serif);font-size:17px;font-style:italic}
.top .sub{font-size:12.5px;color:var(--ink-3)}
.top .grow{flex:1}
.top a{color:var(--ink-2);text-decoration:none;font-size:12.5px;border:1px solid #0000004d;
  border-radius:4px;height:30px;display:inline-flex;align-items:center;padding:0 10px}
.top a:hover{background:#f0f0f0}

/* ---------- app split ---------- */
.app{flex:1;display:flex;min-height:0}
.side{flex:3 1 0;display:flex;min-width:0;background:var(--bg);border-right:1px solid #e2e2e2}
.timeline{flex:none;width:32px;padding:8px 0;display:flex;justify-content:center}
.tl{position:relative;width:5px;background:var(--line);border-radius:8px}
.tl .caret{position:absolute;left:50%;width:10px;height:10px;border-radius:40px;
  background:var(--caret);transform:translate(-50%,-50%);transition:top .25s ease}
.tl .evt{position:absolute;left:50%;width:9px;height:1px;background:var(--evt);
  transform:translateX(-50%);cursor:pointer}
.tl .evt.start::before{content:"";position:absolute;left:-2px;top:-2px;width:5px;height:5px;
  border-radius:40px;background:var(--evt)}
.panel{flex:1;display:flex;flex-direction:column;min-width:0;margin:8px;overflow:hidden}
.toc{flex:none;padding-bottom:6px}
.toc .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:1px solid var(--rule-2);padding:6px 0 3px}
.phase{display:flex;align-items:center;height:30px;border-radius:2px;background:var(--chip);
  color:var(--chip-ink);cursor:pointer;margin-bottom:3px;font-size:13px;user-select:none}
.phase:hover{background:#c3c8de}
.phase.on{background:var(--active);color:#fff}
.phase .n{width:26px;text-align:center;font-family:var(--mono);font-size:11px;opacity:.75}
.cmt{flex:1;min-height:0;overflow:auto;padding:2px 14px 10px;border-top:1px solid var(--rule-2);
  scrollbar-width:10px;scrollbar-color:#858585 #cfcfcf}
.cmt::-webkit-scrollbar{width:10px;background:#cfcfcf;border-radius:20px}
.cmt::-webkit-scrollbar-thumb{background:#858585;border-radius:20px}
.cmt h1{font-family:var(--serif);font-size:17px;font-style:italic;text-align:center;
  font-weight:400;margin:10px 0 6px}
.cmt h2{font-size:13px;font-weight:700;margin:12px 0 4px}
.cmt p{font-size:13.5px;line-height:1.62;text-align:justify;margin:8px 0;color:var(--ink-2)}
.cmt p b{color:var(--ink)}
.cmt code,.cmt .num{font-family:var(--mono);font-size:12.5px;background:#00000008;
  padding:0 3px;border-radius:2px}
.cmt table{border-collapse:collapse;margin:8px auto;font-size:12.5px}
.cmt th{text-align:center;color:var(--ink-3);font-style:italic;font-weight:400;padding:3px 8px}
.cmt thead{border-bottom:1px solid var(--rule)}
.cmt td{text-align:center;padding:2px 8px;font-family:var(--mono);font-size:12px}
.cmt tr th{border-right:1px solid var(--rule)}
.cmt tbody tr td:first-child{text-align:left;font-family:var(--sans);color:var(--ink-2)}
.cmt .note{border-left:2px solid var(--accent);background:#00000006;padding:6px 9px;
  font-size:12.5px;color:var(--ink-2);margin:10px 0}
.cmt .note b{color:var(--ink)}

/* ---------- controls ---------- */
.controls{flex:none;display:flex;justify-content:center;gap:6px;padding:8px 0 2px}
.btn{font:inherit;font-size:13px;border:1px solid #0000004d;border-radius:4px;height:30px;
  padding:0 10px;background:#fff;cursor:pointer;color:var(--ink)}
.btn:hover{background:#efefef}
.btn:disabled{opacity:.4;cursor:default}
.btn.pn{width:60px;font-family:var(--mono)}
.btn.play{width:34px;font-size:14px}

/* ---------- canvas ---------- */
.canvasWrap{flex:5;position:relative;overflow:hidden;background:var(--bg)}
.canvasWrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 6px rgba(20,20,20,.3)}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10.5px;
  color:#2b2b2b;white-space:nowrap;pointer-events:auto;cursor:pointer;
  text-shadow:0 1px 0 #f3f3f3,0 -1px 0 #f3f3f3,1px 0 0 #f3f3f3,-1px 0 0 #f3f3f3}
.lab.title{font-family:var(--sans);font-size:11.5px;font-weight:700;color:#111;letter-spacing:.02em}
.lab.val{color:#0b4d8a}
.lab.dim{opacity:.35}
.lab.hit{outline:1.5px solid var(--caret);outline-offset:2px;border-radius:2px}

.hud{position:absolute;left:12px;top:10px;font-size:11.5px;color:var(--ink-3);
  font-family:var(--mono);pointer-events:none}
.hud b{color:var(--ink);font-family:var(--sans);font-weight:700}
.move{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:44px 48px 44px;
  grid-template-rows:40px 48px 40px;opacity:.8;color:#000}
.move div{display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5c5c5c;
  font-size:20px;user-select:none;filter:drop-shadow(0 0 2px rgba(228,228,228,.8))}
.move div:hover{color:#000}
.move .skip{font-size:13px;font-family:var(--mono)}
.legend{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;gap:3px;
  font-size:11px;color:var(--ink-3)}
.legend .row{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.card{position:absolute;right:16px;top:14px;width:250px;background:#fffffff2;border:1px solid #00000033;
  border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:9px 11px;font-size:12px;
  color:var(--ink-2);display:none}
.card.on{display:block}
.card h3{font-size:12px;margin:0 0 5px;color:var(--ink);font-weight:700}
.card table{border-collapse:collapse;width:100%;font-size:11.5px;margin-top:4px}
.card td{padding:1.5px 0;font-family:var(--mono)}
.card td:last-child{text-align:right}
.card .x{position:absolute;right:6px;top:4px;cursor:pointer;color:var(--ink-3);font-size:13px}
.card .hl{color:var(--accent);font-weight:700}
@media(max-width:900px){
  .app{flex-direction:column-reverse}
  .side{flex:none;height:46%}
  .canvasWrap{flex:1}
}

/* ---------- computation panel (arrays → op → output) ---------- */
.op{position:absolute;left:12px;bottom:12px;width:min(600px,calc(100% - 130px));
  background:#fffffff5;border:1px solid #00000040;border-radius:5px;box-shadow:0 3px 14px rgba(0,0,0,.14);
  padding:9px 11px 8px;display:none;font-size:12px;color:var(--ink-2);z-index:3}
.op.on{display:block}
.op .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.op .hd b{font-size:12px;color:#111}
.op .hd span{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.op .rows{display:flex;flex-direction:column;gap:3px}
.op .r{display:flex;align-items:center;gap:6px}
.op .nm{width:58px;flex:none;font-size:11px;color:var(--ink-3);text-align:right;font-family:var(--mono)}
.op .cells{display:flex;gap:2px;flex:none}
.op .c{width:34px;height:22px;display:flex;align-items:center;justify-content:center;
  border:1px solid #d5d5d5;border-radius:2px;font-family:var(--mono);font-size:10.5px;
  background:#fff;color:#222;cursor:default;transition:background .08s,border-color .08s}
.op .c.src{background:#eef3fa}
.op .c.pick{background:#fff;border-color:#0c6fdf;box-shadow:inset 0 0 0 1px #0c6fdf}
.op .c.out{background:#eaf3ff;border-color:#9dc2ea;font-weight:700;color:#0b4d8a}
.op .c.hot{background:#fff3d6;border-color:#e0b357}
.op .c.wide{width:auto;padding:0 8px}
.op .arrowrow{display:flex;align-items:center;gap:6px;color:#999;font-size:11px}
.op .arrowrow .nm{color:transparent}
.op .fx{font-family:var(--mono);font-size:11.5px;color:#0b4d8a;margin-top:5px;min-height:16px}
.op .fx b{color:#111}
.op .ell{color:#aaa;font-family:var(--mono);font-size:11px;align-self:center;padding:0 2px}
.op svg.curve{display:block;width:100%;height:96px}
.op .lg{display:flex;gap:12px;font-size:10.5px;color:var(--ink-3);margin-top:4px}
.op .lg i{width:8px;height:8px;border-radius:1px;display:inline-block;margin-right:4px}
</style>
</head>

   phase chips + vertical timeline + step commentary + camera pad.
   =========================================================================== */
(function () {
  'use strict';
  const C30 = Math.cos(Math.PI / 6), S30 = Math.sin(Math.PI / 6);
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const nf = (v, d) => (v == null || !isFinite(v) ? '—'
    : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }));

  /* ---------- colour helpers ---------- */
  function hex2rgb(h) {
    const s = h.replace('#', '');
    return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
  }
  function shade(h, f) {
    const [r, g, b] = hex2rgb(h);
    const m = (c) => Math.max(0, Math.min(255, Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f))));
    return `rgb(${m(r)},${m(g)},${m(b)})`;
  }

  /* ---------- isometric maths ---------- */
  const P = (x, y, z) => [(x - z) * C30, (x + z) * S30 - y];

  function cuboid(b) {
    const { x, y, z, w, h, d } = b;
    const x0 = x - w / 2, x1 = x + w / 2, y0 = y - h / 2, y1 = y + h / 2;
    const z0 = z - d / 2, z1 = z + d / 2;
    return {
      top: [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)],
      right: [P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1), P(x1, y0, z0)],
      front: [P(x0, y1, z1), P(x1, y1, z1), P(x1, y0, z1), P(x0, y0, z1)]
    };
  }

  /* ---------- box builders used by page specs ---------- */
  function row(n, o) {
    const out = [];
    const w = o.w || 9, gap = o.gap == null ? 3 : o.gap;
    const step = w + gap;
    const x0 = -(n - 1) * step / 2;
    for (let i = 0; i < n; i++) {
      out.push({
        x: x0 + i * step, y: o.y || 0, z: o.z || 0, w, h: o.h || 9, d: o.d || 9,
        color: o.color, id: o.id ? `${o.id}:${i}` : null,
        label: o.labels ? o.labels[i] : null,
        value: o.values ? o.values[i] : null,
        fmt: o.fmt == null ? 1 : o.fmt,
        tip: o.tip ? o.tip(i) : null,
        detail: o.detail ? o.detail(i) : null
      });
    }
    return out;
  }
  function grid(cols, rows, o) {
    const out = [];
    const w = o.w || 8, gap = o.gap == null ? 3 : o.gap;
    const sx = w + gap, sz = (o.d || 8) + gap;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        out.push({
          x: (c - (cols - 1) / 2) * sx, y: o.y || 0, z: (r - (rows - 1) / 2) * sz,
          w, h: o.h || 8, d: o.d || 8, color: o.color, id: o.id ? `${o.id}:${i}` : null,
          value: o.values ? o.values[i] : null, fmt: o.fmt == null ? 0 : o.fmt,
          tip: o.tip ? o.tip(i) : null, detail: o.detail ? o.detail(i) : null
        });
      }
    }
    return out;
  }
  function box(o) {
    return [{ x: o.x || 0, y: o.y || 0, z: o.z || 0, w: o.w || 40, h: o.h || 20, d: o.d || 20,
      color: o.color, id: o.id, label: o.label, value: o.value, fmt: o.fmt,
      tip: o.tip, detail: o.detail, big: true }];
  }

  /* ---------- app ---------- */
  function run(spec) {
    const svg = $('#scene'), lab = $('#labels'), cmt = $('#cmt'), toc = $('#toc'), tl = $('#tl');
    const stages = spec.stages;
    const camera = { zoom: 1, px: 0, py: 0, rx: 0 };
    let cur = -1, playing = false, timer = null, sel = null;

    /* -------- stage lookup -------- */
    const boxes = [];
    stages.forEach((st, si) => (st.boxes || []).forEach((b) => {
      b.stage = si; b.sid = st.id;
      boxes.push(b);
    }));

    /* -------- geometry: auto-frame the focused stage -------- */
    let frame = { s: 1, ox: 0, oy: 0 };
    function computeFrame(focus) {
      const r = svg.getBoundingClientRect();
      const bs = boxes.filter((b) => focus.has(b.sid));
      if (!bs.length || !r.width) return { s: 1, ox: r.width / 2, oy: r.height / 2 };
      let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      bs.forEach((b) => {
        const c = cuboid(b);
        [c.top, c.right, c.front].forEach((f) => f.forEach(([X, Y]) => {
          if (X < minX) minX = X; if (X > maxX) maxX = X;
          if (Y < minY) minY = Y; if (Y > maxY) maxY = Y;
        }));
      });
      // label headroom above the solid
      minY -= 26;
      /* keep the focused stage above the computation panel */
      const opEl = document.getElementById('op');
      const inset = (opEl && opEl.classList.contains('on') ? opEl.offsetHeight + 14 : 0);
      const availH = Math.max(120, r.height - inset);
      const s = Math.min(r.width * 0.90 / Math.max(maxX - minX, 1),
                         availH * 0.86 / Math.max(maxY - minY, 1)) * camera.zoom;
      return {
        s,
        ox: r.width / 2 - (minX + maxX) / 2 * s + camera.px,
        oy: availH / 2 - (minY + maxY) / 2 * s + camera.py
      };
    }
    function project(p) {
      return [frame.ox + p[0] * frame.s, frame.oy + p[1] * frame.s];
    }
    const pts = (arr) => arr.map((q) => project(q).map((v) => Math.round(v * 10) / 10).join(',')).join(' ');

    function render() {
      const step = spec.steps[cur] || spec.steps[0];
      const si = stages.findIndex((x) => x.id === step.stage);
      const st = stages[si] || stages[0];
      const focus = new Set(step.focus || [st.id]);
      frame = computeFrame(focus);
      /* draw the focused stage plus its neighbours only — the rest is depth */
      const near = new Set();
      [si - 1, si, si + 1].forEach((i) => { if (stages[i]) near.add(stages[i].id); });
      const solids = boxes.filter((b) => b.visible !== false && near.has(b.sid));
      const order = solids.slice().sort((a, b) => (a.z - b.z) || (a.x - b.x));
      let out = '';
      order.forEach((b) => {
        const c = cuboid(b);
        const inFocus = focus.has(b.sid);
        const op = inFocus ? 1 : 0.22;
        const col = b.color || '#c8d2e6';
        out += `<g class="bx" data-id="${b.id || ''}" data-stage="${b.sid}" opacity="${op}"
                 style="cursor:${b.detail ? 'pointer' : 'default'}">` +
          `<polygon points="${pts(c.front)}" fill="${shade(col, -0.16)}" stroke="#00000022"/>` +
          `<polygon points="${pts(c.right)}" fill="${shade(col, -0.04)}" stroke="#00000022"/>` +
          `<polygon points="${pts(c.top)}" fill="${shade(col, 0.22)}" stroke="#00000022"/>` +
          `</g>`;
      });
      svg.innerHTML = out;
      $$('g.bx[data-id]', svg).forEach((g) => {
        const b = boxes.find((x) => (x.id || '') === g.dataset.id && near.has(x.sid));
        if (!b || !b.detail) return;
        g.style.cursor = 'pointer';
        g.addEventListener('click', () => { sel = b; openCard(b); render(); });
      });

      /* labels (upright) */
      let L = '';
      const r = svg.getBoundingClientRect();
      const inside = (x, y) => x > -80 && x < r.width + 80 && y > -60 && y < r.height + 60;
      solids.forEach((b) => {
        const inFocus = focus.has(b.sid);
        if (!inFocus && !b.big) return;
        const [cx, cy] = project(P(b.x, b.y + (b.h || 9) / 2 + 3, b.z));
        if (!inside(cx, cy)) return;
        const bw = frame.s * (b.w || 9);
        if (!b.big && bw < 13) return;          // too small to read: no label
        if (b.big && b.label) {
          L += `<div class="lab title ${inFocus ? '' : 'dim'}" data-id="${b.id || ''}"
                  style="left:${cx}px;top:${cy - 14}px">${b.label}</div>`;
        }
        if (b.value != null) {
          const txt = typeof b.value === 'number'
            ? nf(b.value, b.fmt == null ? 1 : b.fmt) : String(b.value);
          L += `<div class="lab val ${inFocus ? '' : 'dim'}" data-id="${b.id || ''}"
                  style="left:${cx}px;top:${cy}px">${txt}</div>`;
        }
      });
      (st.labels || []).forEach((t) => {
        const [cx, cy] = project(P(t.x, t.y, t.z));
        L += `<div class="lab ${t.cls || ''}" style="left:${cx}px;top:${cy}px">${t.text}</div>`;
      });
      lab.innerHTML = L;
      if (sel) {
        $$('.lab', lab).forEach((e) => { if (e.dataset.id === sel.id) e.classList.add('hit'); });
      }
      $$('.lab.val[data-id]', lab).forEach((el) => {
        el.addEventListener('click', () => {
          const b = boxes.find((x) => (x.id || '') === el.dataset.id);
          if (b && b.detail) { sel = b; openCard(b); render(); }
        });
      });
      $('#hud').innerHTML = `<b>${spec.title}</b> · step ${cur + 1}/${spec.steps.length} · ` +
        `${step.title} · ${camera.zoom.toFixed(2)}×`;
    }

    /* -------- detail card -------- */
    function openCard(b) {
      const card = $('#card');
      card.classList.add('on');
      card.innerHTML = `<span class="x" id="cardX">×</span><h3>${b.tip || b.label || 'cell'}</h3>` +
        (b.detail.rows ? '<table>' + b.detail.rows.map(([k, v, hl]) =>
          `<tr><td>${k}</td><td class="${hl ? 'hl' : ''}">${v}</td></tr>`).join('') + '</table>' : '') +
        (b.detail.note ? `<div style="margin-top:6px;color:#666">${b.detail.note}</div>` : '');
      $('#cardX').addEventListener('click', () => { card.classList.remove('on'); sel = null; render(); });
    }

    /* -------- steps -------- */
    function go(k, fromUser) {
      k = Math.max(0, Math.min(spec.steps.length - 1, k));
      cur = k;
      const st = spec.steps[k];
      camera.zoom = st.zoom || 1;
      camera.px = 0;
      camera.py = 0;
      $$('.phase', toc).forEach((p, i) => p.classList.toggle('on', i === k));
      const caret = $('.caret', tl);
      if (caret) caret.style.top = `${(k + 0.5) / spec.steps.length * 100}%`;
      cmt.innerHTML = `<h1>${st.title}</h1>` + st.html;
      cmt.scrollTop = 0;
      $('#card').classList.remove('on');
      sel = null;
      if (window.APP.op) APP.op($('#op'), st.op || null);
      render();
      if (fromUser) stop();
    }
    function stop() { playing = false; clearInterval(timer); const b = $('#play'); if (b) b.textContent = '▶'; }
    function play() {
      playing = !playing;
      $('#play').textContent = playing ? '❚❚' : '▶';
      if (!playing) return clearInterval(timer);
      timer = setInterval(() => {
        if (cur >= spec.steps.length - 1) return stop();
        go(cur + 1);
      }, 4200);
    }

    /* -------- build chrome -------- */
    $$('.phase', toc).forEach((p, i) => p.addEventListener('click', () => go(i, true)));
    const total = spec.steps.length;
    tl.innerHTML = '<div class="caret"></div>' + spec.steps.map((s, i) => {
      const top = (i + 0.5) / total * 100;
      return `<div class="evt start" data-i="${i}" style="top:${top}%"></div>`;
    }).join('');
    $$('.evt', tl).forEach((e) => e.addEventListener('click', () => go(+e.dataset.i, true)));
    $('#prev').addEventListener('click', () => go(cur - 1, true));
    $('#next').addEventListener('click', () => go(cur + 1, true));
    $('#play').addEventListener('click', play);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { go(cur + 1, true); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { go(cur - 1, true); e.preventDefault(); }
      else if (e.key === ' ') { play(); e.preventDefault(); }
    });

    /* -------- camera pad + mouse -------- */
    $$('.move div[data-mv]').forEach((d) => d.addEventListener('click', () => {
      const m = d.dataset.mv;
      if (m === 'l') camera.px -= 60;
      if (m === 'r') camera.px += 60;
      if (m === 'u') camera.py -= 60;
      if (m === 'd') camera.py += 60;
      if (m === 'in') camera.zoom = Math.min(2.6, camera.zoom * 1.15);
      if (m === 'out') camera.zoom = Math.max(0.55, camera.zoom / 1.15);
      if (m === 'reset') { camera.zoom = spec.steps[cur].zoom || 1; camera.px = 0; camera.py = 0; }
      render();
    }));
    let drag = null;
    svg.addEventListener('pointerdown', (e) => {
      drag = { x: e.clientX, y: e.clientY, px: camera.px, py: camera.py };
      svg.classList.add('drag');
    });
    window.addEventListener('pointermove', (e) => {
      if (!drag) return;
      camera.px = drag.px + (e.clientX - drag.x);
      camera.py = drag.py + (e.clientY - drag.y);
      render();
    });
    window.addEventListener('pointerup', () => { drag = null; svg.classList.remove('drag'); });
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      camera.zoom = Math.max(0.55, Math.min(2.6, camera.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
      render();
    }, { passive: false });
    window.addEventListener('resize', render);

    go(0);
  }


  /* ---------- upstream band: instruments → files → ingest ----------
     Shared by both pages: shows where the hourly tables themselves come from. */
  function upstream(U) {
    if (!U) return { stages: [], steps: [] };
    const BLUE = '#7fa8d6', GREY = '#c8d2e6', PURPLE = '#9d8ef0';
    const put = (arr, xs, o) => xs.map((x, i) => ({
      x, y: o.y || 0, z: o.z, w: o.w, h: o.h || 16, d: o.d || 16, color: o.color,
      id: `${o.id}:${arr[i].id}`, label: arr[i].name, big: !!o.big,
      value: o.big ? (arr[i].value || '') : null,
      detail: o.detail ? o.detail(arr[i]) : null, tip: arr[i].name
    }));
    const tags = (arr, xs, z, y) => arr.map((a, i) => ({
      x: xs[i], y: y, z: z, text: a.what || a.note || '', cls: 'val'
    }));

    const ix = [-84, -28, 28, 84];
    const s1 = { id: 'sensor', name: '관측 · 모델', z: -240, focus: ['sensor'],
      labels: tags(U.instruments, ix, -240, -20),
      boxes: put(U.instruments, ix, { z: -240, w: 50, color: BLUE, id: 'sensor', big: true,
        detail: (a) => ({ rows: [['무엇', a.what], ['주기', a.cadence], ['규모', a.value]] }) }) };

    const fx = [-84, -28, 28, 84];
    const s2 = { id: 'files', name: '원본 파일', z: -160, focus: ['files'],
      labels: tags(U.files, fx, -160, -20),
      boxes: put(U.files, fx, { z: -160, w: 50, color: GREY, id: 'file', big: true,
        detail: (a) => ({ rows: [['경로', a.path], ['규모', a.note], ['파싱', a.value]] }) }) };

    const gx = [-70, 0, 70];
    const s3 = { id: 'ingest', name: '수집 · 1시간 격자', z: -80, focus: ['ingest'],
      labels: tags(U.ingest, gx, -80, -20),
      boxes: put(U.ingest, gx, { z: -80, w: 56, color: PURPLE, id: 'ing', big: true,
        detail: (a) => ({ rows: [['무엇', a.name], ['경로', a.note], ['결과', a.value]] }) }) };

    const S = U.suvi, G = U.gong, E = U.enlil;
    const steps = [
      { stage: 'sensor', zoom: 0.95, title: '관측 · 모델', html:
        `<p>모든 값은 네 곳에서 시작합니다. 위성의 분당 측정, 태양면 영상, 자기장 지도,
         그리고 수치모델 실행.</p>
         <table><tbody>` +
        U.instruments.map((a) => `<tr><td>${a.name}</td><td>${a.what}</td></tr>`).join('') +
        `</tbody></table>` },
      { stage: 'files', zoom: 0.95, title: '원본 파일', html:
        `<p>기관이 내놓는 형식 그대로 받습니다. CDF·netCDF·FITS·JSON — 주기와 스키마가 제각각입니다.</p>
         <table><tbody>` +
        U.files.map((a) => `<tr><td>${a.name}</td><td>${a.note}</td></tr>`).join('') +
        `</tbody></table>
         <div class="note">SUVI netCDF ${S.files.toLocaleString()}편 · ${S.gb} GB,
         GONG 지도 ${G.maps.toLocaleString()}장, ENLIL ${E.runs.toLocaleString()} 실행</div>` },
      { stage: 'ingest', zoom: 0.95, title: '수집 · 1시간 격자', html:
        `<p>collector가 내려받아 해시와 함께 RawDB에 남기고, 시간당 파케이로 정리합니다.
         결측은 ffill.</p>
         <table><thead><tr><th>계열</th><th>행</th></tr></thead><tbody>
         <tr><td>ACE 스냅숏</td><td>36,056 × 35</td></tr>
         <tr><td>CH 시간별</td><td>36,015 × 180</td></tr>
         <tr><td>SUVI 패치</td><td>36,015 × 148</td></tr>
         <tr><td>ENLIL 실행</td><td>${E.runs.toLocaleString()}건</td></tr>
         </tbody></table>
         <div class="note">SUVI 슬롯 ${S.slots.toLocaleString()}개 중 ok ${S.ok.toLocaleString()},
         missing ${S.missing.toLocaleString()}</div>` }
    ];
    return { stages: [s1, s2, s3], steps };
  }


  /* ---------------------------------------------------------------------------
     Computation panel: shows the actual arrays and the arithmetic of one step.
     types: 'rowop'  inputs → (weighted|mean|sum) → output, cell by cell
            'reduce' one array → a single number (Σ, mean)
            'curve'  31-point scan with the guard band and the chosen point
  --------------------------------------------------------------------------- */
  function op(host, spec) {
    if (!host) return;
    if (!spec) { host.classList.remove('on'); host.innerHTML = ''; return; }
    host.classList.add('on');
    const cell = (v, cls, i, fmt) =>
      `<div class="c ${cls}" data-i="${i}" title="${typeof v === 'number' ? nf(v, fmt == null ? 2 : fmt) : v}">${
        typeof v === 'number' ? nf(v, fmt == null ? 2 : fmt) : v}</div>`;
    const ell = '<span class="ell">…</span>';
    let h = `<div class="hd"><b>${spec.title}</b><span>${spec.sub || ''}</span></div>`;

    if (spec.type === 'rowop') {
      const rows = spec.rows;           // [{name, values:[…], color}]
      const out = spec.out;             // {name, values:[…]}
      const n = out.values.length;
      h += '<div class="rows">';
      rows.forEach((r) => {
        h += `<div class="r"><span class="nm">${r.name}</span><div class="cells">` +
          r.values.map((v, i) => cell(v, 'src', i, r.fmt)).join('') + '</div></div>';
      });
      h += `<div class="arrowrow"><span class="nm"></span><span>${spec.opLabel || '↓'}</span></div>`;
      h += `<div class="r"><span class="nm">${out.name}</span><div class="cells">` +
        out.values.map((v, i) => cell(v, 'out', i, out.fmt)).join('') + '</div></div>';
      h += '</div>';
      h += `<div class="fx" id="op-fx">${spec.hint || '셀에 마우스를 올리면 계산이 나옵니다'}</div>`;
      if (spec.note) h += `<div class="lg">${spec.note}</div>`;
    }

    if (spec.type === 'reduce') {
      const r0 = spec.row;              // {name, values, fmt}
      h += `<div class="r"><span class="nm">${r0.name}</span><div class="cells">` +
        r0.values.map((v, i) => cell(v, 'src', i, r0.fmt)).join('') +
        (spec.truncate ? ell : '') + '</div></div>' +
        `<div class="arrowrow"><span class="nm"></span><span>${spec.opLabel}</span></div>` +
        `<div class="r"><span class="nm">${spec.outName}</span><div class="cells">` +
        cell(spec.outValue, 'out', -1, spec.outFmt == null ? 2 : spec.outFmt) + '</div></div>' +
        `<div class="fx">${spec.formula}</div>`;
    }

    if (spec.type === 'curve') {
      const pts = spec.points;          // [{w, y, feasible}]
      const W = 560, H = 96, PAD = 18;
      const ys = pts.map((p) => p.y), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const X = (w) => PAD + (w - pts[0].w) / (pts[pts.length - 1].w - pts[0].w) * (W - 2 * PAD);
      const Y = (v) => H - PAD - (v - y0) / Math.max(y1 - y0, 1e-9) * (H - 2 * PAD);
      let g = `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
      g += `<line x1="${PAD}" y1="${H - PAD}" x2="${W - PAD}" y2="${H - PAD}" stroke="#ccc"/>`;
      pts.forEach((p) => {
        g += `<circle cx="${X(p.w).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6"
          fill="${p.feasible ? '#7fb389' : '#d9a3a3'}" data-w="${p.w}" data-y="${p.y}"/>`;
      });
      const ch = pts.find((p) => Math.abs(p.w - spec.chosen) < 1e-9);
      if (ch) {
        g += `<line x1="${X(ch.w)}" y1="${PAD - 6}" x2="${X(ch.w)}" y2="${H - PAD}" stroke="#0c6fdf"
          stroke-dasharray="3 3"/><circle cx="${X(ch.w)}" cy="${Y(ch.y)}" r="4" fill="none"
          stroke="#0c6fdf" stroke-width="1.6"/>`;
      }
      g += '</svg>';
      h += g + `<div class="fx" id="op-fx">${spec.formula}</div>` +
        `<div class="lg"><span><i style="background:#7fb389"></i>가드 통과</span>
         <span><i style="background:#d9a3a3"></i>제외</span>
         <span><i style="background:#0c6fdf"></i>w* = ${nf(spec.chosen, 3)}</span></div>`;
    }

    host.innerHTML = h;

    /* hover arithmetic */
    const fx = host.querySelector('#op-fx');
    if (spec.type === 'rowop') {
      const cs = [...host.querySelectorAll('.c.out')];
      cs.forEach((c) => {
        c.addEventListener('mouseenter', () => {
          const i = +c.dataset.i;
          host.querySelectorAll('.c.src').forEach((x) => x.classList.toggle('pick', +x.dataset.i === i));
          if (fx) fx.innerHTML = spec.formula(i);
        });
        c.addEventListener('mouseleave', () => {
          host.querySelectorAll('.c.pick').forEach((x) => x.classList.remove('pick'));
          if (fx) fx.textContent = spec.hint || '';
        });
      });
    }
    if (spec.type === 'curve') {
      const cs = [...host.querySelectorAll('circle[data-w]')];
      const tf = (x) => ((x) / 560 * 100);
      cs.forEach((c) => {
        c.addEventListener('mouseenter', () => {
          const w = +c.dataset.w, y = +c.dataset.y;
          const p = spec.points.find((q) => Math.abs(q.w - w) < 1e-9);
          if (fx) fx.innerHTML = spec.hover(w, y, p);
        });
        c.addEventListener('mouseleave', () => { if (fx) fx.innerHTML = spec.formula; });
      });
    }
  }

  window.APP = { run, row, grid, box, nf, shade, upstream, op };
})();
</script>
<script>
(function () {
  const { row, grid, box, nf, upstream } = APP;
  const X = DATA.examples.main, rows = X.rows, R = DATA.raw.examples.mixture;
  const S = DATA.scores, T = DATA.training;
  const level = rows.map((r) => r.level), prob = rows.map((r) => r.prob);
  const gap = rows.map((r) => r.gap), pred = rows.map((r) => r.pred), truth = rows.map((r) => r.truth);
  const lo = Math.min(...pred), hi = Math.max(...pred);
  const heat = (v, l2, h2) => {
    const u = (v - l2) / Math.max(h2 - l2, 1e-9);
    const c1 = [206, 220, 236], c2 = [141, 176, 216], c3 = [157, 142, 240], c4 = [232, 195, 122];
    const seg = u < 0.5 ? [c1, c2, u / 0.5] : u < 0.8 ? [c2, c3, (u - 0.5) / 0.3] : [c3, c4, (u - 0.8) / 0.2];
    const [x, y, w] = seg;
    return `rgb(${x.map((q, i) => Math.round(q + (y[i] - q) * w)).join(',')})`;
  };
  const cellDetail = (i) => {
    const r = rows[i];
    return { rows: [
      ['level', nf(r.level, 2)],
      ['p (≥550)', nf(r.prob, 3)],
      ['gap (m + tree)', nf(r.gap, 2)],
      ['level + p·(gap−level)', nf(r.pred, 2), true],
      ['실측', nf(r.truth, 2)],
      ['오차 level → pred', nf(r.err_level, 2) + ' → ' + nf(r.err_pred, 2)]
    ] };
  };
  const BLUE = '#7fa8d6', PURPLE = '#9d8ef0', GREEN = '#86c99a', AMBER = '#e8c37a';
  const tlo = Math.min(...truth), thi = Math.max(...truth);

  const UP = upstream(DATA.raw.upstream);
  const R8 = rows.slice(0, 8);
  const y8 = R8.map((r) => r.truth), l8 = R8.map((r) => r.level), p8 = R8.map((r) => r.prob);
  const g8 = R8.map((r) => r.gap), m8 = R8.map((r) => r.block_mean);
  const tr8 = R8.map((r) => r.gap - r.block_mean);
  const mask8 = y8.map((v) => (v >= 550 ? 1 : 0));
  const wgt8 = y8.map((v) => (v >= 550 ? 4 : 1));
  const loss8 = y8.map((v, i) => +(wgt8[i] * (l8[i] - v) ** 2).toFixed(1));
  const pr8 = R8.map((r) => r.pred);
  const stages = [...UP.stages,
    { id: 'raw', name: '원자료', z: 0, focus: ['raw'], boxes: [
      ...box({ x: -75, w: 40, h: 16, d: 16, color: BLUE, id: 'raw:ace',
        label: 'ACE', value: R.raw_ace.t0.ace_speed_kms, fmt: 1 }),
      ...box({ x: -25, w: 40, h: 16, d: 16, color: BLUE, id: 'raw:suvi',
        label: 'SUVI age', value: R.img.age_h, fmt: 1 }),
      ...box({ x: 25, w: 40, h: 16, d: 16, color: BLUE, id: 'raw:ch',
        label: 'CH t055', value: R.features.ch.ch_ch_t055_area, fmt: 3 }),
      ...box({ x: 75, w: 40, h: 16, d: 16, color: BLUE, id: 'raw:enlil',
        label: 'ENLIL', value: R.features.enlil.enlil_n_pending, fmt: 0 })
    ] },
    { id: 'target', name: '정답 72h', z: 80, focus: ['target'],
      labels: [{ x: 0, y: 24, z: 80, text: 'y(h1 … h72)' }],
      boxes: (() => {
        const bs = row(72, { z: 80, w: 5, gap: 2, h: 8, d: 8, id: 'y',
          values: truth, tip: (i) => `y h${i + 1} · ${nf(truth[i], 1)}` });
        bs.forEach((b2, i) => { b2.color = heat(truth[i], tlo, thi); });
        return bs;
      })() },
    { id: 'features', name: '입력 237열', z: 170, focus: ['features'],
      labels: [{ x: 0, y: 58, z: 170, text: '상수 21 · 가변 9×24 = 237열' }], boxes: [
        ...row(21, { z: 170, y: 30, w: 9, gap: 3, h: 6, d: 6, color: '#b9c6db', id: 'const' }),
        ...grid(24, 9, { y: 0, z: 170, w: 5, gap: 2, h: 5, d: 5, color: '#cfd8e8', id: 'vary' })
      ] },
    { id: 'heads', name: '세 헤드', z: 260, focus: ['heads'], boxes: [
      ...box({ x: -70, z: 260, w: 54, h: 22, d: 22, color: '#c8d2e6', id: 'h:level',
        label: 'level', value: level[0], fmt: 2 }),
      ...box({ x: 0, z: 260, w: 54, h: 22, d: 22, color: AMBER, id: 'h:prob',
        label: 'p(≥550)', value: prob[0], fmt: 3 }),
      ...box({ x: 70, z: 260, w: 54, h: 22, d: 22, color: PURPLE, id: 'h:gap',
        label: 'gap', value: gap[0], fmt: 2 })
    ] },
    { id: 'compose', name: '합성 72', z: 350, focus: ['compose'],
      labels: [{ x: 0, y: 26, z: 350, text: 'pred = level + p·(gap − level)' }],
      boxes: (() => {
        const bs = row(72, { z: 350, w: 5, gap: 2, h: 8, d: 8, id: 'pred',
          values: pred, detail: cellDetail, tip: (i) => `h${i + 1} · ${nf(pred[i], 1)} km/s` });
        bs.forEach((b2, i) => { b2.color = heat(pred[i], lo, hi); });
        return bs;
      })() },
    { id: 'score', name: '채점', z: 440, focus: ['score'], boxes: [
      ...box({ x: -45, z: 440, w: 60, h: 26, d: 26, color: GREEN, id: 'sc:total',
        label: 'total MSE', value: S.total, fmt: 1 }),
      ...box({ x: 45, z: 440, w: 60, h: 26, d: 26, color: GREEN, id: 'sc:tail',
        label: '≥550 MSE', value: S.ge550, fmt: 1 })
    ] }
  ];

  const steps = [...UP.steps,
    { stage: 'raw', zoom: 0.95, title: '원자료', html:
      `<p>${X.origin} 한 시점. ACE 관측·SUVI 영상·코로나홀·ENLIL 실행이 입력을 만듭니다.</p>
       <table><tbody>
       <tr><td>ACE 속도 / 밀도</td><td>${nf(R.raw_ace.t0.ace_speed_kms, 1)} km/s · ${nf(R.raw_ace.t0.ace_density_cm3, 2)}</td></tr>
       <tr><td>SUVI 슬롯 age</td><td>${nf(R.img.age_h, 2)} h</td></tr>
       <tr><td>코로나홀 t055</td><td>${nf(R.features.ch.ch_ch_t055_area, 3)}</td></tr>
       <tr><td>ENLIL pending</td><td>${nf(R.features.enlil.enlil_n_pending, 0)}</td></tr>
       </tbody></table>` },
    { stage: 'target', zoom: 0.95, title: '정답 72시간',
      op: { type: 'rowop', title: '정답 → 돌파 라벨', sub: '1[y ≥ 550] · 앞 8시간',
        rows: [{ name: 'y km/s', values: y8, fmt: 1 }],
        out: { name: '1[y≥550]', values: mask8, fmt: 0 },
        opLabel: '↓ 550 이상이면 1',
        hint: '출력 셀에 마우스를 올리세요',
        formula: (i) => `${nf(y8[i], 1)} ${y8[i] >= 550 ? '≥' : '&lt;'} 550 → <b>${mask8[i]}</b>` },
      html:
      `<p>origin+1h … +72h의 ACE 속도. 학습에는 <b>origin+144h ≤ cutoff</b>인 행만 씁니다.</p>
       <table><thead><tr><th>h</th><th>y</th></tr></thead><tbody>
       <tr><td>1</td><td>${nf(truth[0], 1)}</td></tr>
       <tr><td>24</td><td>${nf(truth[23], 1)}</td></tr>
       <tr><td>72</td><td>${nf(truth[71], 1)}</td></tr>
       </tbody></table>
       <div class="note">fit rows (F2) ${T.n_fit_rows_final.toLocaleString()}</div>` },
    { stage: 'features', zoom: 0.95, title: '입력 237열', html:
      `<p>상수 21개(origin 고정) + 가변 9개 × 24시간. 블록마다 자기 구간만 잘라 씁니다.</p>
       <table><tbody>
       <tr><td>블록당 열</td><td>${DATA.features.n_cols_per_block}</td></tr>
       <tr><td>상수 / 가변</td><td>${DATA.features.n_constant_selected} / ${DATA.features.n_varying_selected}</td></tr>
       <tr><td>v_lag0</td><td>${nf(DATA.features.constant.find((c) => c.name === 'v_lag0').value, 1)}</td></tr>
       </tbody></table>` },
    { stage: 'heads', zoom: 0.95, title: 'level 헤드',
      op: { type: 'rowop', title: 'level 손실 (point4 목적함수)', sub: 'w=4 if y≥550 else 1',
        rows: [{ name: '실측 y', values: y8, fmt: 1 }, { name: 'level', values: l8, fmt: 1 },
               { name: '가중 w', values: wgt8, fmt: 0 }],
        out: { name: 'w·(p−y)²', values: loss8, fmt: 0 },
        opLabel: '↓ w·(level − y)²',
        hint: '출력 셀에 마우스를 올리세요',
        formula: (i) => `${wgt8[i]}·(${nf(l8[i], 2)} − ${nf(y8[i], 2)})² = ${wgt8[i]}·${nf((l8[i] - y8[i]) ** 2, 1)} = <b>${nf(loss8[i], 1)}</b>` },
      html:
      `<p>조건부 평균. 550 이상 셀에 가중치 4를 준 제곱오차로 900 round.</p>
       <table><tbody>
       <tr><td>base_score</td><td>${nf(T.base_score_level['0'], 2)}</td></tr>
       <tr><td>level (h1)</td><td>${nf(level[0], 2)}</td></tr>
       <tr><td>실측</td><td>${nf(truth[0], 2)}</td></tr>
       </tbody></table>` },
    { stage: 'heads', zoom: 0.95, title: '확률 헤드', html:
      `<p>0/1 라벨 + 제곱오차(Brier). 출력은 [0,1]로 자릅니다.</p>
       <table><tbody>
       <tr><td>라벨 평균</td><td>${nf(T.base_rate_by_block['0'], 3)}</td></tr>
       <tr><td>p (h1)</td><td>${nf(prob[0], 3)}</td></tr>
       <tr><td>Brier (검증)</td><td>${nf(DATA.prob_head.final_b0.brier_valid_replay, 4)}</td></tr>
       </tbody></table>` },
    { stage: 'heads', zoom: 0.95, title: 'gap 헤드',
      op: { type: 'rowop', title: '블록 평균 + 트리 → gap', sub: '이벤트 행에서 학습한 잔차',
        rows: [{ name: 'm (평균)', values: m8, fmt: 1 }, { name: 'tree', values: tr8, fmt: 1 }],
        out: { name: 'gap', values: g8, fmt: 1 },
        opLabel: '↓ m + tree',
        hint: '출력 셀에 마우스를 올리세요',
        formula: (i) => `${nf(m8[i], 2)} + ${nf(tr8[i], 2)} = <b>${nf(g8[i], 2)}</b>` },
      html:
      `<p>이벤트가 있는 행만. 라벨은 블록 평균에 대한 잔차이고, 추론 때 평균을 더합니다.</p>
       <table><tbody>
       <tr><td>m (h1)</td><td>${nf(rows[0].block_mean, 2)}</td></tr>
       <tr><td>tree</td><td>${nf(gap[0] - rows[0].block_mean, 2)}</td></tr>
       <tr><td>gap (h1)</td><td>${nf(gap[0], 2)}</td></tr>
       </tbody></table>` },
    { stage: 'compose', zoom: 0.95, title: '합성',
      op: { type: 'rowop', title: 'level + p·(gap − level)', sub: '앞 8시간',
        rows: [{ name: 'level', values: l8, fmt: 1 }, { name: 'p', values: p8, fmt: 3 },
               { name: 'gap', values: g8, fmt: 1 }],
        out: { name: 'pred', values: pr8, fmt: 1 },
        opLabel: '↓ level + p·(gap − level)',
        hint: '출력 셀에 마우스를 올리세요',
        formula: (i) => `${nf(l8[i], 2)} + ${nf(p8[i], 3)}·(${nf(g8[i], 2)} − ${nf(l8[i], 2)}) = ` +
          `${nf(l8[i], 2)} ${g8[i] - l8[i] >= 0 ? '+' : '−'} ${nf(Math.abs(p8[i] * (g8[i] - l8[i])), 2)} = <b>${nf(pr8[i], 2)}</b>` },
      html:
      `<p>세 헤드를 horizon마다 한 줄로 합칩니다. <b>칸을 클릭</b>하면 그 계산이 뜹니다.</p>
       <div class="note">pred = ${nf(level[0], 2)} + ${nf(prob[0], 3)}·(${nf(gap[0], 2)} − ${nf(level[0], 2)})
         = <b>${nf(pred[0], 2)}</b></div>
       <table><thead><tr><th>h</th><th>pred</th><th>실측</th></tr></thead><tbody>
       <tr><td>1</td><td>${nf(pred[0], 2)}</td><td>${nf(truth[0], 2)}</td></tr>
       <tr><td>30</td><td>${nf(pred[29], 2)}</td><td>${nf(truth[29], 2)}</td></tr>
       <tr><td>72</td><td>${nf(pred[71], 2)}</td><td>${nf(truth[71], 2)}</td></tr>
       </tbody></table>` },
    { stage: 'compose', zoom: 0.95, title: '72개 출력', html:
      `<p>한 origin의 72칸이 그대로 제출 예측의 한 행이 됩니다.</p>
       <table><tbody>
       <tr><td>이 origin MSE</td><td>${nf(X.mse_level, 1)} → ${nf(X.mse_pred, 1)}</td></tr>
       <tr><td>p 최대</td><td>${nf(X.pmax, 3)}</td></tr>
       <tr><td>이벤트 시간</td><td>${X.event_hours} / 72</td></tr>
       </tbody></table>` },
    { stage: 'score', zoom: 0.95, title: '채점',
      op: { type: 'reduce', title: '오차² → MSE', sub: '예시 origin 8칸 (전체 357,840칸)',
        row: { name: '(p−y)²', values: pr8.map((v, i) => +((v - y8[i]) ** 2).toFixed(1)), fmt: 0 },
        opLabel: 'mean ↓', outName: '표본 MSE',
        outValue: pr8.reduce((a2, v, i) => a2 + (v - y8[i]) ** 2, 0) / 8,
        formula: `mean(${pr8.map((v, i) => nf((v - y8[i]) ** 2, 0)).join(', ')}) = ` +
          `${nf(pr8.reduce((a2, v, i) => a2 + (v - y8[i]) ** 2, 0) / 8, 1)} &nbsp;·&nbsp; 전체 total = <b>${nf(S.total, 2)}</b>` },
      html:
      `<p>총 MSE는 나빠졌지만 꼬리 세 칸은 모두 6,000 아래 — 프론티어의 끝점입니다.</p>
       <table><thead><tr><th></th><th>control</th><th>mixture</th></tr></thead><tbody>
       <tr><td>total</td><td>${nf(S.control_total, 1)}</td><td>${nf(S.total, 1)}</td></tr>
       <tr><td>≥550</td><td>${nf(S.control_ge550, 1)}</td><td>${nf(S.ge550, 1)}</td></tr>
       <tr><td>F1 ≥550</td><td>${nf(S.control_f1_ge550, 1)}</td><td>${nf(S.f1_ge550, 1)}</td></tr>
       <tr><td>F2 ≥550</td><td>${nf(S.control_f2_ge550, 1)}</td><td>${nf(S.f2_ge550, 1)}</td></tr>
       </tbody></table>` }
  ];

  const byId = Object.fromEntries(stages.map((s) => [s.id, s]));
  const appSteps = steps.map((s) => Object.assign({}, s, { focus: byId[s.stage].focus }));
  const NUP = UP.steps.length;
  document.querySelector('#toc').innerHTML =
    '<div class="grp">원자료 이전 · Source</div>' +
    appSteps.slice(0, NUP).map((s, i) =>
      `<div class="phase" data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.title}</div>`).join('') +
    '<div class="grp">추론 · Model</div>' +
    appSteps.slice(NUP).map((s, j) => {
      const i = j + NUP;
      return `<div class="phase" data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.title}</div>`;
    }).join('');
  document.querySelector('#legend').innerHTML = [['#7fa8d6', '원자료'], ['#c8d2e6', 'level'],
    ['#e8c37a', 'p / gap'], ['#9d8ef0', 'gap'], ['#86c99a', '결과']]
    .map(([c, t]) => `<div class="row"><i style="background:${c}"></i>${t}</div>`).join('');
  document.querySelector('#reset').addEventListener('click', (e) => { e.preventDefault(); location.reload(); });
  APP.run({ title: 'E2000FS mixture2comp', stages, steps: appSteps });
})();
</script>
