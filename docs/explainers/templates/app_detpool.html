<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>detpool_gpd · inference</title>
<style>/*__CSS__*/</style>
</head>
<body>
<header class="top">
  <div class="brand">E2000FS · detpool</div>
  <div class="sub">detroute + gpd arm, walk-through</div>
  <div class="grow"></div>
  <a href="#" id="reset">처음으로</a>
</header>

<main class="app">
  <section class="side">
    <div class="timeline"><div class="tl" id="tl"></div></div>
    <div class="panel">
      <div class="toc" id="toc"></div>
      <div class="cmt" id="cmt"></div>
      <div class="controls">
        <button class="btn pn" id="prev">◀</button>
        <button class="btn play" id="play">▶</button>
        <button class="btn pn" id="next">▶</button>
      </div>
    </div>
  </section>

  <section class="canvasWrap">
    <svg id="scene"></svg>
    <div id="labels"></div>
    <div class="hud" id="hud"></div>
    <div class="card" id="card"></div>
    <div class="legend" id="legend"></div>
    <div class="op" id="op"></div>
    <div class="move">
      <div data-mv="out">−</div><div data-mv="u">↑</div><div data-mv="in">+</div>
      <div data-mv="l">←</div><div data-mv="reset">⟲</div><div data-mv="r">→</div>
      <div></div><div data-mv="d">↓</div><div></div>
    </div>
  </section>
</main>

<script id="payload" type="application/json">__DATA_JSON__</script>
<script>const DATA = JSON.parse(document.getElementById('payload').textContent);</script>
<script>/*__JS__*/</script>
<script>
(function () {
  const { row, grid, box, nf, upstream } = APP;
  const M = DATA.worked_main, ph = M.per_horizon, R = DATA.raw.examples.detpool;
  const A = DATA.base_scores, S = DATA.scores, C = DATA.compare;
  const b = ph.map((r) => r.base), a = ph.map((r) => r.arm), p = ph.map((r) => r.blend);
  const t = ph.map((r) => r.truth);
  const BLUE = '#7fa8d6', AMBER = '#e8c37a', PURPLE = '#9d8ef0', GREY = '#c9c9d5', GREEN = '#86c99a';
  const lo = Math.min(...p), hi = Math.max(...p);
  const heat = (v) => {
    const u = (v - lo) / Math.max(hi - lo, 1e-9);
    const c1 = [206, 220, 236], c2 = [141, 176, 216], c3 = [157, 142, 240], c4 = [232, 195, 122];
    const seg = u < 0.5 ? [c1, c2, u / 0.5] : u < 0.8 ? [c2, c3, (u - 0.5) / 0.3] : [c3, c4, (u - 0.8) / 0.2];
    const [x, y, w] = seg;
    return `rgb(${x.map((q, i) => Math.round(q + (y[i] - q) * w)).join(',')})`;
  };
  const cellDetail = (i) => {
    const r = ph[i];
    return { rows: [
      ['base', nf(r.base, 2) + ' km/s'],
      ['arm', nf(r.arm, 2) + ' km/s'],
      ['w', nf(M.chosen, 3)],
      ['(1−w)·base + w·arm', nf(r.blend, 2), true],
      ['실측', nf(r.truth, 2)],
      ['오차 base → pooled', nf(r.resid_base, 2) + ' → ' + nf(r.resid_blend, 2)]
    ] };
  };

  const UP = upstream(DATA.raw.upstream);
  const W = DATA.window_sample;
  const rB = W.base.map((v, i) => +(v - W.truth[i]).toFixed(2));
  const rA = W.arm.map((v, i) => +(v - W.truth[i]).toFixed(2));
  const sqB = rB.map((v) => +(v * v).toFixed(1));
  const sqA = rA.map((v) => +(v * v).toFixed(1));
  const w6 = (R.raw_ace.win6_values || []).filter((v) => v != null);
  const N8 = W.base.length;
  const idx8 = [0, 1, 2, 3, 4, 5, 6, 7];
  const stages = [...UP.stages,
    { id: 'raw', name: '원자료', z: 0, focus: ['raw'], boxes: [
      ...box({ x: -75, z: 0, w: 40, h: 16, d: 16, color: BLUE, id: 'raw:ace',
        label: 'ACE', value: R.raw_ace.t0.ace_speed_kms, fmt: 1 }),
      ...box({ x: -25, z: 0, w: 40, h: 16, d: 16, color: BLUE, id: 'raw:suvi',
        label: 'SUVI age', value: R.img.age_h, fmt: 1 }),
      ...box({ x: 25, z: 0, w: 40, h: 16, d: 16, color: BLUE, id: 'raw:ch',
        label: 'CH t055', value: R.features.ch.ch_ch_t055_area, fmt: 3 }),
      ...box({ x: 75, z: 0, w: 40, h: 16, d: 16, color: BLUE, id: 'raw:enlil',
        label: 'ENLIL', value: R.features.enlil.enlil_n_pending, fmt: 0 })
    ] },
    { id: 'grid', name: '1시간 격자', z: 80, focus: ['grid'],
      boxes: row(24, { z: 80, w: 8, gap: 4, h: 12, d: 12, color: GREY, id: 'grid' }) },
    { id: 'bundle', name: '번들', z: 170, focus: ['bundle'],
      labels: [{ x: 0, y: 60, z: 170, text: 'C 30 · E 60 · past 24' }],
      boxes: [
        ...row(30, { z: 170, y: 26, w: 6, gap: 3, h: 6, d: 6, color: '#b9c6db', id: 'bundleC' }),
        ...grid(12, 5, { y: 0, z: 170, w: 7, gap: 3, h: 7, d: 7, color: '#cfd8e8', id: 'bundleE' })
      ] },
    { id: 'preds', name: '두 예측', z: 260, focus: ['preds'],
      labels: [{ x: -262, y: 0, z: 260, text: 'base' }, { x: -262, y: 22, z: 260, text: 'arm' }],
      boxes: [
      ...row(72, { z: 260, y: 0, w: 5, gap: 2, h: 8, d: 8, color: GREY, values: b, id: 'base',
        detail: () => null }),
      ...row(72, { z: 260, y: 22, w: 5, gap: 2, h: 8, d: 8, color: AMBER, values: a, id: 'arm',
        detail: () => null })
    ] },
    { id: 'stats', name: '성숙 창 · 6개 상수', z: 350, focus: ['stats'], boxes: [
      ...row(6, { z: 350, y: 30, w: 26, gap: 12, h: 12, d: 12, color: PURPLE, id: 'stat',
        labels: ['a0', 'b0', 'x0', 'a1', 'b1', 'x1'],
        values: [M.stats.a0, M.stats.b0, M.stats.x0, M.stats.a1, M.stats.b1, M.stats.x1],
        fmt: 0 })
    ] },
    { id: 'scan', name: '스캔 31점', z: 350, focus: ['scan'],
      labels: [{ x: 0, y: 26, z: 350, text: 'w = 0 … 0.75 (초록 = 가드 통과)' }], boxes:
      Array.from({ length: M.scan.length }, (_, i) => ({
        x: (i - 15) * 11, y: 0, z: 350, w: 8, h: 8, d: 8, id: 'scan:' + i,
        color: M.scan[i].feasible ? '#a9d3b8' : '#e2b6b6',
        tip: `w = ${M.scan[i].w.toFixed(3)}`,
        detail: { rows: [['w', M.scan[i].w.toFixed(3)],
          ['MSE(w)', nf(M.scan[i].total, 2)],
          ['tail(w)', nf(M.scan[i].tail, 2)],
          ['가드 (tail ≤ a1)', M.scan[i].feasible ? '통과' : '제외']] }
      })) },
    { id: 'blend', name: '블렌드 72', z: 440, focus: ['blend'],
      labels: [{ x: 0, y: 26, z: 440, text: 'pooled h1 … h72' }], boxes:
      row(72, { z: 440, w: 5, gap: 2, h: 8, d: 8, id: 'blend',
        values: p, color: '#b9c6db', detail: cellDetail,
        tip: (i) => `h${i + 1} · ${nf(p[i], 1)} km/s` }) },
    { id: 'score', name: '채점', z: 530, focus: ['score'], boxes: [
      ...box({ x: -45, z: 530, w: 60, h: 26, d: 26, color: GREEN, id: 'sc:total',
        label: 'total MSE', value: S.total, fmt: 1 }),
      ...box({ x: 45, z: 530, w: 60, h: 26, d: 26, color: GREEN, id: 'sc:tail',
        label: '≥550 MSE', value: S.ge550, fmt: 1 })
    ] }
  ];

  /* blend cells get a real detail popup */
  stages[5].boxes.forEach((bx, i) => { bx.color = heat(p[i]); bx.tip = `h${i + 1} · ${nf(p[i], 1)} km/s`; });

  const steps = [...UP.steps,
    { stage: 'raw', zoom: 0.95, title: '원자료', html:
      `<p><b>${M.origin}</b> 한 시점. 네 계열이 동시에 들어옵니다 — ACE 위성 관측, SUVI 영상 슬롯,
       코로나홀 지도, WSA-Enlil 실행 상태.</p>
       <table><thead><tr><th>원자료</th><th>값</th></tr></thead><tbody>
       <tr><td>ACE 속도</td><td>${nf(R.raw_ace.t0.ace_speed_kms, 2)} km/s</td></tr>
       <tr><td>ACE 밀도</td><td>${nf(R.raw_ace.t0.ace_density_cm3, 2)} cm⁻³</td></tr>
       <tr><td>SUVI 슬롯 (age)</td><td>${nf(R.img.age_h, 2)} h</td></tr>
       <tr><td>코로나홀 t055 면적</td><td>${nf(R.features.ch.ch_ch_t055_area, 3)}</td></tr>
       <tr><td>ENLIL 대기 실행</td><td>${nf(R.features.enlil.enlil_n_pending, 0)}</td></tr>
       </tbody></table>` },
    { stage: 'grid', zoom: 0.95, title: '1시간 격자',
      op: { type: 'reduce', title: '원자료 6행 → 특징 1개',
        sub: `ace_speed_kms_m6 · ${M.origin}`,
        row: { name: 'ACE km/s', values: w6, fmt: 1 },
        opLabel: 'mean(관측 6행) ↓', outName: 'm6', outValue: R.features.ace.ace_speed_kms_m6,
        formula: `mean(${w6.map((v) => nf(v, 1)).join(', ')}) = <b>${nf(R.features.ace.ace_speed_kms_m6, 2)}</b>` },
      html:
      `<p>주기가 다른 원자료를 1시간 격자에 올립니다. 특징은 <b>origin 이하</b>, 정답은
       <b>origin+1h … +72h</b>.</p>
       <table><tbody>
       <tr><td>격자 길이</td><td>${DATA.raw.grid.hourly_rows.toLocaleString()} h</td></tr>
       <tr><td>결측(채움)</td><td>${nf(DATA.raw.grid.was_missing_pct, 1)}%</td></tr>
       <tr><td>라벨 성숙</td><td>origin + 144h ≤ cutoff</td></tr>
       </tbody></table>` },
    { stage: 'bundle', zoom: 0.95, title: '번들', html:
      `<p>선택된 30개 특징이 한 행이 됩니다. 상수는 origin 고정, 가변 9개는 72시간 궤적.</p>
       <table><tbody>
       <tr><td>C</td><td>${DATA.raw.bundle.C_shape.join(' × ')}</td></tr>
       <tr><td>E</td><td>${DATA.raw.bundle.E_shape.join(' × ')}</td></tr>
       <tr><td>past</td><td>${DATA.raw.bundle.past_shape.join(' × ')}</td></tr>
       </tbody></table>` },
    { stage: 'preds', zoom: 0.95, title: '두 예측', html:
      `<p>이 모델의 입력은 예측 두 개입니다. 72개 숫자 두 벌이 그대로 들어옵니다.</p>
       <table><thead><tr><th>h</th><th>base</th><th>arm</th></tr></thead><tbody>
       <tr><td>1</td><td>${nf(b[0], 2)}</td><td>${nf(a[0], 2)}</td></tr>
       <tr><td>2</td><td>${nf(b[1], 2)}</td><td>${nf(a[1], 2)}</td></tr>
       <tr><td>72</td><td>${nf(b[71], 2)}</td><td>${nf(a[71], 2)}</td></tr>
       </tbody></table>` },
    { stage: 'stats', zoom: 0.95, title: '성숙 창',
      op: { type: 'rowop', title: '창 안의 잔차 → 제곱오차', sub: `마지막 ${N8}개 origin · h=1`,
        rows: [
          { name: 'base', values: W.base, fmt: 1 },
          { name: 'arm', values: W.arm, fmt: 1 },
          { name: '실측 y', values: W.truth, fmt: 1 }
        ],
        out: { name: 'base²', values: sqB, fmt: 0 },
        opLabel: '↓ (base − y)²',
        hint: '출력 셀에 마우스를 올리세요',
        formula: (i) => `(${nf(W.base[i], 2)} − ${nf(W.truth[i], 2)})² = (${nf(rB[i], 2)})² = <b>${nf(sqB[i], 1)}</b>` },
      html:
      `<p>origin i에서 쓸 수 있는 잔차는 목표 시각이 i 이하인 것뿐. 마지막 사용 가능 origin은
       <b>i − 72</b>.</p>
       <table><tbody>
       <tr><td>k (성숙 origin)</td><td>${M.k.toLocaleString()}</td></tr>
       <tr><td>cells</td><td>${(M.rows * 72).toLocaleString()}</td></tr>
       <tr><td>꼬리 셀 (≥550)</td><td>${M.tail_cells.toLocaleString()}</td></tr>
       </tbody></table>` },
    { stage: 'stats', zoom: 0.95, title: '6개 상수',
      op: { type: 'reduce', title: '제곱오차 → 상수 하나', sub: '표본 8셀 (전체 창은 46,008셀)',
        row: { name: 'base²', values: sqB, fmt: 0 },
        opLabel: 'mean ↓', outName: 'a0 (표본)', outValue: sqB.reduce((a, b) => a + b, 0) / sqB.length,
        formula: `mean(${sqB.map((v) => nf(v, 0)).join(', ')}) = ${nf(sqB.reduce((a, b) => a + b, 0) / sqB.length, 1)}` +
          ` &nbsp;·&nbsp; 전체 창 a0 = <b>${nf(M.stats.a0, 1)}</b>` },
      html:
      `<p>두 모델의 제곱오차·교차항을 전체와 꼬리에서 접은 값. 이 여섯 개면 어떤 w도 즉시 계산됩니다.</p>
       <table><thead><tr><th></th><th>전체</th><th>꼬리</th></tr></thead><tbody>
       <tr><td>base</td><td>${nf(M.stats.a0, 1)}</td><td>${nf(M.stats.a1, 1)}</td></tr>
       <tr><td>arm</td><td>${nf(M.stats.b0, 1)}</td><td>${nf(M.stats.b1, 1)}</td></tr>
       <tr><td>교차</td><td>${nf(M.stats.x0, 1)}</td><td>${nf(M.stats.x1, 1)}</td></tr>
       </tbody></table>
       <div class="note">MSE(w) = (1−w)²a0 + w²b0 + 2w(1−w)x0</div>` },
    { stage: 'scan', zoom: 0.95, title: '31점 스캔',
      op: { type: 'curve', title: 'MSE(w) — 31점', sub: '6개 상수로 매 점을 즉시 계산',
        points: M.scan.map((r) => ({ w: r.w, y: r.total, feasible: r.feasible })),
        chosen: M.chosen,
        formula: `MSE(w) = (1−w)²·${nf(M.stats.a0, 0)} + w²·${nf(M.stats.b0, 0)} + 2w(1−w)·${nf(M.stats.x0, 0)}`,
        hover: (w, y, p) => `w = ${nf(w, 3)} → MSE ${nf(y, 2)} · tail ${nf(p ? M.scan[Math.round(w / 0.025)].tail : 0, 2)}` },
      html:
      `<p>총 MSE 최소를 찾되, 꼬리 MSE가 base보다 나빠지면 제외합니다. 초록이 통과한 점.</p>
       <table><tbody>
       <tr><td>MSE(0)</td><td>${nf(M.w0_scan.total, 1)}</td></tr>
       <tr><td>MSE(w*)</td><td>${nf(M.chosen_scan.total, 1)}</td></tr>
       <tr><td>tail(0) → tail(w*)</td><td>${nf(M.w0_scan.tail, 1)} → ${nf(M.chosen_scan.tail, 1)}</td></tr>
       <tr><td>w*</td><td>${nf(M.chosen, 3)}</td></tr>
       </tbody></table>` },
    { stage: 'blend', zoom: 0.95, title: '72개 조립',
      op: { type: 'rowop', title: '두 예측 → 제출값', sub: `w = ${nf(M.chosen, 3)} · 72칸 중 앞 8칸`,
        rows: [
          { name: 'base', values: b.slice(0, 8), fmt: 1 },
          { name: 'arm', values: a.slice(0, 8), fmt: 1 }
        ],
        out: { name: 'pooled', values: p.slice(0, 8), fmt: 1 },
        opLabel: `↓ (1−${nf(M.chosen, 3)})·base + ${nf(M.chosen, 3)}·arm`,
        hint: '출력 셀에 마우스를 올리세요',
        formula: (i) => `${nf(1 - M.chosen, 3)}·${nf(b[i], 2)} + ${nf(M.chosen, 3)}·${nf(a[i], 2)} = ` +
          `${nf((1 - M.chosen) * b[i], 2)} + ${nf(M.chosen * a[i], 2)} = <b>${nf(p[i], 2)}</b>` },
      html:
      `<p>같은 w로 72시간을 섞습니다. <b>칸을 클릭</b>하면 그 시간의 계산이 뜹니다.</p>
       <div class="note">pred_h = (1 − ${nf(M.chosen, 3)})·base_h + ${nf(M.chosen, 3)}·arm_h</div>
       <table><thead><tr><th>h</th><th>pooled</th><th>실측</th></tr></thead><tbody>
       <tr><td>1</td><td>${nf(p[0], 2)}</td><td>${nf(t[0], 2)}</td></tr>
       <tr><td>30</td><td>${nf(p[29], 2)}</td><td>${nf(t[29], 2)}</td></tr>
       <tr><td>72</td><td>${nf(p[71], 2)}</td><td>${nf(t[71], 2)}</td></tr>
       </tbody></table>` },
    { stage: 'score', zoom: 0.95, title: '채점',
      op: { type: 'reduce', title: '오차² → MSE', sub: '예시 origin 8칸 (전체 357,840칸)',
        row: { name: '(p−y)²', values: p.slice(0, 8).map((v, i) => +((v - t[i]) ** 2).toFixed(1)), fmt: 0 },
        opLabel: 'mean ↓', outName: '표본 MSE',
        outValue: p.slice(0, 8).reduce((a2, v, i) => a2 + (v - t[i]) ** 2, 0) / 8,
        formula: `mean(${p.slice(0, 8).map((v, i) => nf((v - t[i]) ** 2, 0)).join(', ')}) = ` +
          `${nf(p.slice(0, 8).reduce((a2, v, i) => a2 + (v - t[i]) ** 2, 0) / 8, 1)} &nbsp;·&nbsp; 전체 total = <b>${nf(S.total, 2)}</b>` },
      html:
      `<p>F1은 조금 나빠지고 F2에서 벌었습니다. 꼬리에서 크게 줄었습니다.</p>
       <table><thead><tr><th></th><th>base</th><th>pooled</th></tr></thead><tbody>
       <tr><td>total</td><td>${nf(A.total, 2)}</td><td>${nf(S.total, 2)}</td></tr>
       <tr><td>F1</td><td>${nf(A.f1, 2)}</td><td>${nf(S.f1, 2)}</td></tr>
       <tr><td>F2</td><td>${nf(A.f2, 2)}</td><td>${nf(S.f2, 2)}</td></tr>
       <tr><td>≥550</td><td>${nf(A.ge550, 2)}</td><td>${nf(S.ge550, 2)}</td></tr>
       </tbody></table>` }
  ];

  /* map step → stage focus + camera */
  const byId = Object.fromEntries(stages.map((s) => [s.id, s]));
  const appSteps = steps.map((s) => Object.assign({}, s, {
    focus: byId[s.stage].focus, zoom: s.zoom,
    stageName: byId[s.stage].name
  }));
  const NUP = UP.steps.length;
  document.querySelector('#toc').innerHTML =
    '<div class="grp">원자료 이전 · Source</div>' +
    appSteps.slice(0, NUP).map((s, i) =>
      `<div class="phase" data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.title}</div>`).join('') +
    '<div class="grp">추론 · Model</div>' +
    appSteps.slice(NUP).map((s, j) => {
      const i = j + NUP;
      return `<div class="phase" data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.title}</div>`;
    }).join('');
  document.querySelector('#legend').innerHTML = [['#7fa8d6', '원자료'], ['#c9c9d5', 'base'], ['#e8c37a', 'arm'],
    ['#9d8ef0', '상수/스캔'], ['#86c99a', '결과']]
    .map(([c, t]) => `<div class="row"><i style="background:${c}"></i>${t}</div>`).join('');
  document.querySelector('#reset').addEventListener('click', (e) => { e.preventDefault(); location.reload(); });
  APP.run({ title: 'E2000FS detpool', stages, steps: appSteps });
})();
</script>
</body>
</html>
