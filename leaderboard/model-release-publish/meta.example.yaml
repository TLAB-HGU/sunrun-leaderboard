team_member: alice
experiment: lgbm-lags-v1
description: LightGBM on 168h lags + solar-cycle features, direct multi-horizon
no_future_leakage: true   # only data with timestamp <= origin_last_input_utc was used
f1_training_data_end_utc: 2025-12-01T00:00:00Z   # end of the data used to train/tune the model behind F1 (2026-01..03) predictions; must be <= 2025-12-29T00:00:00Z
f2_training_data_end_utc: 2026-03-01T00:00:00Z   # same for F2 (2026-04..06) predictions; must be <= 2026-03-29T00:00:00Z
f3_training_data_end_utc: 2026-06-01T00:00:00Z   # same for F3 (2026-07..09) predictions; must be <= 2026-06-29T00:00:00Z
config:
  data:
    source: sun-db/timeseries/ace_solar
    features: [ace_speed_kms]
    lookback_hours: 168
  hyperparameters:
    num_leaves: 31
    learning_rate: 0.05
    n_estimators: 500
inference_seconds_per_fold: 0.012345  # mean time to produce one 72h forecast; excludes load/train/init/save
