team_member: seongeun
experiment: e2000fs_calib11b_metricwt
description: 'e2000fs_calib11b_metricwt. Ablation of e2000fs_calib11_metricgn with
  the anchor-residual target removed, so only the objective changes: the board key''s
  own gradient replaces the parent''s 4x sample weight above 550 km/s. The key is
  S = mean_lead sqrt(RMSE_l*TRMSE_l), so S^4 ~ MSE_l*TIMSE_l per lead, and the onboarding
  TIMSE formula decomposes exactly into per-observation weights, TIMSE_l = sum_i a_il
  e_i^2 with a_il = (1/R) sum_{k: q_k<=y_i} dq_k/N_k (k over the 100 percentile thresholds,
  N_k the exceedance count, R = v_max-v_min). Hence dS ~ e_i[1 + rho_l (N a_i)] and
  one weighted squared-error fit satisfies the first-order condition. rho_l = MSE_l/TIMSE_l
  is a dimensionless scalar measured on a strictly prior calibration block (the last
  25% of the training window, predicted by the parent recipe fitted on the earlier
  75%); a_il is a property of the training labels and needs no predictions. No hand-set
  constant remains: the 550 km/s threshold and the 4x weight do not appear in training
  or prediction, and the weight profile is smooth in the label (about 1.04x at the
  median, 1.17x at the 90th percentile, 4.8x at the 99th, the log-survival shape the
  metric implies). Target, features, seeds and capacity are the frozen parent recipe:
  three 24-h vector-leaf XGBoost boosters per period on the 237-column Top30 design,
  900 rounds, depth 3, eta 0.03, subsample 0.8, colsample 0.7, min_child_weight 20,
  lambda 5, seed 42, level target. The fitted population estimator is E[w(Y)Y|x]/E[w(Y)|x],
  the probability-weighted mixture of conditional tail means that TIMSE minimises,
  not the conditional mean plain squared error minimises. One booster per horizon
  block, no routing, no gate, no blend, no post-processing. Pre-F1 quarter (2025 Q4)
  check: 1.9% behind the incumbent 4x/550 step; F1/F2/F3 measured TOTAL S 103.874
  vs 100.092 for the incumbent, RMSE 66.611 vs 66.441. Refit on the F1/F2/F3 quarters
  with cutoffs 2025-12-29 / 2026-03-29 / 2026-06-29 and 72 h target maturity; all
  6,315 origins forecast unconditionally.'
no_future_leakage: true
f1_training_data_end_utc: '2025-12-29T00:00:00Z'
f2_training_data_end_utc: '2026-03-29T00:00:00Z'
f3_training_data_end_utc: '2026-06-29T00:00:00Z'
config:
  data:
    feature_set: df.parquet Top30 (21 constant + 24 h x 9 varying per block), unchanged
      from the parent
    source: data-v2/input/df.parquet
    blocks:
    - 0
    - 1
    - 2
    ace_lag_hours: 0
    maturity_hours: 72
    prefill: causal forward fill
    periods:
      F1:
        count: 2089
      F2:
        count: 2113
      F3:
        count: 2113
  hyperparameters:
    objective:
      family: squared error with metric-derived per-(row, lead) sample weights
      weights: 'w_il = 1 + rho_l * (N a_il); a_il is the exact decomposition of onboarding
        TIMSE (a_il = (1/R) sum_{k: q_k<=y_i} dq_k/N_k), N a_il dimensionless'
      rho_source: rho_l = MSE_l/TIMSE_l of the parent recipe on the last 25% of the
        training window (calibration block), fitted on the earlier 75%; scikit-learn
        cross-fitting rationale
      estimand: E[w(Y)Y|x]/E[w(Y)|x] = probability-weighted mixture of conditional
        tail means
      removed_heuristics:
      - 4x sample weight above 550 km/s
      - 550 km/s threshold anywhere in training
      no_hand_set_constants: rho_l is measured from data; a_il is a property of the
        labels
      rho_by_period: {}
    target:
      form: level (y), identical to the parent; the anchor-residual variant was dropped
        because it raised RMSE and TIMSE
    booster:
      recipe: frozen e2000fs_calib_point4_144h xgboost recipe, unchanged
      max_depth: 3
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.7
      min_child_weight: 20
      reg_lambda: 5
      multi_strategy: multi_output_tree
      rounds: 900
      outputs_per_fit: 24 horizons per booster
      seed: 42
    post_processing: none (no clipping, no calibration lane, no blend)
inference_seconds_per_fold: 1.4651479167652407e-05
architecture_url: https://github.com/TLAB-HGU/sunrun-leaderboard/blob/86e8c1f00457753e4b032960669ee3b811b0f064/research/e2000fs_calib11b_metricwt/experiment.py
