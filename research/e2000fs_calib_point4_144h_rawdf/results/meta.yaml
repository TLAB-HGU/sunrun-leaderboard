team_member: seongeun
experiment: e2000fs_calib_point4_144h_rawdf
description: 'e2000fs_calib_point4_144h_rawdf. The frozen e2000fs_calib_point4_144h
  recipe refit on the 2026-11-02 df.parquet, which is rebuilt from data-v2/raw alone
  (data-v2/notebooks/raw_to_input_df.ipynb): every source time t goes to hour bin
  floor(t,1h)+1h, so the ACE value of origin O is the row labelled O-1h; no forward
  fill, no walk-back to an older SUVI frame, no stale/cover masks; y = SWEPAM speed
  at the label time with status 0 only, never filled (about 67% of hours); train origins
  hourly instead of every third hour. Model unchanged: three 24-output vector-leaf
  XGBoost boosters per period on 21 constant + 24 h x 9 varying = 237 columns, depth
  3, lr 0.03, 900 rounds, seed 42, weight 4 on y >= 550 km/s normalised per horizon,
  144 h maturity mask. Two changes forced by the table: the SUVI dark-area columns
  are read as suvi_t0xx_* (formerly ch_ch_t0xx_*), and missing targets get weight
  0 in the squared error (an origin with no observed target in a block is not a training
  row). MEASURED: TOTAL S 102.494 (point4 100.092), TIMSE 23,912.9 (23,960.1), RMSE
  68.966 (66.441), F1 S 127.376 (124.564), F2 S 74.017 (72.430), F3 S 63.109 (60.415).
  Worse than point4 on S in every period; submitted on user request as the reference
  result of the raw-only input table, not as an improvement.'
no_future_leakage: true
f1_training_data_end_utc: '2025-12-29T00:00:00Z'
f2_training_data_end_utc: '2026-03-29T00:00:00Z'
f3_training_data_end_utc: '2026-06-29T00:00:00Z'
config:
  data:
    source: data-v2/input/df.parquet (2026-11-02, built from data-v2/raw by data-v2/notebooks/raw_to_input_df.ipynb)
    feature_set: 'point4 Top30: 21 constant + 24 h x 9 varying per block = 237 columns'
    constant:
    - v_lag0
    - ace_speed_kms_last
    - ace_density_cm3_last
    - ace_density_cm3_m6
    - ace_temperature_k_last
    - ace_temperature_k_m24
    - ace_bt_nt_last
    - ace_bt_nt_m6
    - ace_by_gsm_nt_m24
    - ace_epam_p_channel3_last
    - ace_sis_gt10_flux_last
    - suvi_t035_top2_area
    - suvi_t035_meridian15_equatorial_area
    - suvi_t035_meridian30_equatorial_area
    - suvi_t035_equatorial_area
    - suvi_t055_meridian15_area
    - suvi_t055_meridian30_equatorial_area
    - suvi_t055_equatorial_area
    - img_age_h
    - enlil_n_pending
    - enlil_kp
    varying:
    - rec26
    - rec27
    - rec28
    - rec_mean
    - strip_v350_logmed
    - strip_v450_logmed
    - strip_v550_dark
    - strip_v650_dark
    - strip_v750_logmed
    blocks:
    - 0
    - 1
    - 2
    time_bin: floor(t, 1h) + 1h for every source; origin O uses bins <= O
    target: SWEPAM bulk speed at the label time, status 0 only, no fill
    missing_handling: none in the table; missing targets get weight 0 in the loss
    train_origin_stride_hours: 1
    maturity_hours: 72
    mask: origin + 144 h <= cutoff
    periods:
      F1:
        count: 2089
      F2:
        count: 2113
      F3:
        count: 2113
  hyperparameters:
    recipe: frozen e2000fs_calib_point4_144h xgboost recipe
    objective: squared error, weight 4 on y >= 550 km/s normalised by the mean weight
      per horizon over observed targets, weight 0 on missing targets
    max_depth: 3
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.7
    min_child_weight: 20
    reg_lambda: 5
    multi_strategy: multi_output_tree
    rounds: 900
    outputs_per_fit: 24
    seed: 42
    post_processing: none
    inference_seconds_per_fold_measure: three 900-round boosters, F1 queries, one
      thread
inference_seconds_per_fold: 4.19e-05
architecture_url: https://github.com/TLAB-HGU/sunrun-leaderboard/blob/dd36b2534520db66dc36add0e8dbc701101a2e09/research/e2000fs_calib_point4_144h_rawdf/experiment.py
