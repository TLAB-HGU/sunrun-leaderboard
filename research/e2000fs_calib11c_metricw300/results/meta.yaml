team_member: seongeun
experiment: e2000fs_calib11c_metricw300
description: 'e2000fs_calib11c_metricw300. Two changes to the frozen parent e2000fs_calib_point4_144h,
  both selected on strictly pre-cutoff data. (1) The objective is the board key''s
  own gradient instead of a hand-set constant: the key is S = mean_lead sqrt(RMSE_l*TRMSE_l),
  so S^4 ~ MSE_l*TIMSE_l per lead, and the onboarding TIMSE formula decomposes exactly
  into per-observation weights TIMSE_l = sum_i a_il e_i^2 with a_il = (1/R) sum_{k:
  q_k<=y_i} dq_k/N_k, giving dS ~ e_i[1 + rho_l (N a_i)] with rho_l = MSE_l/TIMSE_l
  measured on a strictly prior calibration block (the last 25% of the training window).
  The 550 km/s threshold and the 4x weight of the parent are absent from training
  and prediction; the weight profile is smooth in the label (about 1.04x at the median,
  1.17x at the 90th percentile, 4.8x at the 99th). The fitted population estimator
  is E[w(Y)Y|x]/E[w(Y)|x], the probability-weighted mixture of conditional tail means
  that TIMSE minimises. (2) The booster round count is re-selected by walk-forward
  instead of inherited: the parent''s 900 rounds over-fit this objective. The rule
  was fixed before the test periods were touched - evaluate on the three most recent
  quarters that end before the F1 training cutoff (2025 Q2/Q3/Q4), and take the round
  count with the lowest mean S. 300 rounds won on every one of the three quarters
  (Q2 134.785 vs 136.493, Q3 76.922 vs 77.497, Q4 121.885 vs 122.219 at 450 rounds),
  and at 300 rounds this arm also beats the parent''s own 4x/550 recipe on the pre-F1
  quarter (S 121.885 vs 122.182) - something the same arm could not do at 900 rounds
  (124.494). Features, target (level), seeds, three 24-h vector-leaf boosters per
  period, the 237-column Top30 design and every other hyper-parameter are the frozen
  parent recipe. No routing, no gate, no blend, no post-processing, no calibration
  lane. F1/F2/F3 are fitted with cutoffs 2025-12-29 / 2026-03-29 / 2026-06-29 and
  72 h target maturity; all 6,315 origins are forecast unconditionally. Measured on
  the board metric: TOTAL S 101.371, TIMSE 24,298.7, RMSE 67.513.'
no_future_leakage: true
f1_training_data_end_utc: '2025-12-29T00:00:00Z'
f2_training_data_end_utc: '2026-03-29T00:00:00Z'
f3_training_data_end_utc: '2026-06-29T00:00:00Z'
config:
  data:
    feature_set: df.parquet Top30 (21 constant + 24 h x 9 varying per block), unchanged
      from the parent
    source: data-v2/input/df.parquet
    blocks:
    - 0
    - 1
    - 2
    ace_lag_hours: 0
    maturity_hours: 72
    prefill: causal forward fill
    periods:
      F1:
        count: 2089
      F2:
        count: 2113
      F3:
        count: 2113
  hyperparameters:
    objective:
      family: squared error with metric-derived per-(row, lead) sample weights
      weights: 'w_il = 1 + rho_l * (N a_il); a_il is the exact decomposition of onboarding
        TIMSE (a_il = (1/R) sum_{k: q_k<=y_i} dq_k/N_k), N a_il dimensionless'
      rho_source: rho_l = MSE_l/TIMSE_l of the parent recipe on the last 25% of the
        training window (calibration block), fitted on the earlier 75%; scikit-learn
        cross-fitting rationale
      estimand: E[w(Y)Y|x]/E[w(Y)|x] = probability-weighted mixture of conditional
        tail means
      removed_heuristics:
      - 4x sample weight above 550 km/s
      - 550 km/s threshold anywhere in training
      no_hand_set_constants: rho_l is measured from data; a_il is a property of the
        labels
      rho_by_period: {}
    target:
      form: level (y), identical to the parent; the anchor-residual variant was dropped
        because it raised RMSE and TIMSE
    booster:
      recipe: frozen e2000fs_calib_point4_144h xgboost recipe, unchanged
      max_depth: 3
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.7
      min_child_weight: 20
      reg_lambda: 5
      multi_strategy: multi_output_tree
      rounds: 300
      outputs_per_fit: 24 horizons per booster
      seed: 42
      rounds_selection: walk-forward on 2025 Q2/Q3/Q4 (mean S); 300 won on all three,
        interior optimum (150 rounds worse at 122.869 on Q4)
    post_processing: none (no clipping, no calibration lane, no blend)
inference_seconds_per_fold: 7.658595838189526e-06
architecture_url: https://github.com/TLAB-HGU/sunrun-leaderboard/blob/51cc11b379541497205a48b5fe676b3e20241360/research/e2000fs_calib11c_metricw300/experiment.py
